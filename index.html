ideias.push({t:"13. Unhas ao Domicilio",tipo:"off",custo:"400MT",lucro:"250MT a 500MT por cliente",passos:"1. Compra 5 cores.\n2. 3 vizinhas gratis para treinar.\n3. Cobra 150MT simples, 250MT com desenho.\n4. Vai a casa da cliente.",erro:"Nao usar verniz vencido.",tel:""});
ideias.push({t:"14. Organizar Festas",tipo:"off",custo:"500MT",lucro:"1000MT a 2500MT por festa",passos:"1. Aprende no YouTube: Decoracao simples.\n2. Oferece: Decoro por 1000MT.\n3. Compra baloes, faz arco.\n4. Tira foto, posta.",erro:"Nao chegar atrasado.",tel:""});
ideias.push({t:"15. Treino de Futebol para Miudos",tipo:"off",custo:"0MT",lucro:"200MT por miudo por mes",passos:"1. Junta 10 miudos.\n2. Treino 2x semana, 1h.\n3. Cobra 200MT por mes.\n4. Se fores pontual, pais pagam.",erro:"Nao faltar treino.",tel:""});function limpa(s){s=s.toLowerCase().trim();s=s.normalize("NFD").replace(/[\u0300-\u036f]/g,"");s=s.replace(/[?!.,]/g,"");s=s.replace(/\s+/g," ");return s;}
function renderIdeias(){
var c=document.getElementById('conteudo');
var html="<div class='card'><b>15 Trabalhos Praticos</b>\nClica em GUARDAR para guardar nos Favoritos.\nEscolhe 1 e comeca hoje.</div>";
for(var i=0;i<ideias.length;i++){var it=ideias[i];if(filtroAtual!=='todas'&&it.tipo!==filtroAtual)continue;var badge=it.tipo==='on'?"NA INTERNET":"NA VIDA REAL";var guardado=favs.indexOf(i)>-1;var txtBtn=guardado?"GUARDADO - CLICA PARA TIRAR":"GUARDAR NOS FAVORITOS";var cls=guardado?"btnFav on":"btnFav";var zap="";if(it.tel){zap="<br><button class='btnZap' onclick=\"window.open('https://wa.me/258"+it.tel.replace(/[^0-9]/g,'')+"?text=Ola, vi a tua ideia no MOZ AJUDA')\">Contactar: "+it.tel+" no WhatsApp</button>";}html+="<div class='card'><button class='"+cls+"' onclick='favoritar("+i+")'>"+txtBtn+"</button>\n<span class='tag'>"+badge+"</span>\n<b>"+it.t+"</b>\nComecar: "+it.custo+" | Lucro: "+it.lucro+"\n\n<div class='passo'>"+it.passos+"</div>\n<b>Erro a evitar:</b> "+it.erro+zap+"</div>";}

function setFiltro(f){filtroAtual=f;document.getElementById('f-todas').className=f==='todas'?'on':'';document.getElementById('f-on').className=f==='on'?'on':'';document.getElementById('f-off').className=f==='off'?'on':'';mostra('dinheiro');}
function mostra(qual){
document.getElementById('b-dinheiro').className=qual==='dinheiro'?'on':'';document.getElementById('b-trad').className=qual==='trad'?'on':'';
document.getElementById('filtros').style.display=qual==='dinheiro'?'flex':'none';

if(qual==='fav'){var h="<div class='card'><b>MEUS FAVORITOS</b>\nAqui ficam as ideias que guardaste.</div>";if(favs.length===0){h+="<div class='card'>Ainda nao tens favoritos. Clica em GUARDAR numa ideia.</div>";}for(var i=0;i<favs.length;i++){var it=ideias[favs[i]];h+="<div class='card'><b>"+it.t+"</b>\nLucro: "+it.lucro+"\n\n<div class='passo'>"+it.passos+"</div></div>";}c.innerHTML=h;}

function abrirSettings(){document.getElementById('settingsBox').style.display='block';document.getElementById('adminBox').style.display='none';window.scrollTo(0,1000);}

}
