<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GlobalMarket MZ - Compra e Venda</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Inter',sans-serif}
body{background:#eaeded;color:#333}
header{background:#131921;color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100}
.logo{font-size:20px;font-weight:700;color:#FF9900}
.user{display:flex;align-items:center;gap:8px;font-size:13px}
.user img{width:32px;height:32px;border-radius:50%;border:2px solid #FF9900}
.tabs{background:#232f3e;display:flex;gap:5px;padding:0 12px;overflow-x:auto}
.tab-btn{background:none;border:0;color:#fff;padding:12px 14px;cursor:pointer;font-weight:500;font-size:13px;white-space:nowrap;border-bottom:3px solid transparent}
.tab-btn.active{color:#FF9900;border-bottom-color:#FF9900}
main{max-width:1100px;margin:20px auto;padding:0 14px}
.tab-content{display:none}
.tab-content.active{display:block}
h2{font-size:20px;margin-bottom:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.card{background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.08);display:flex;flex-direction:column}
.card img{width:100%;height:180px;object-fit:cover;background:#eee}
.body{padding:14px;flex:1}
.body b{font-size:15px}
.price{font-size:18px;font-weight:700;color:#b12704;margin:6px 0}
.desc{font-size:13px;color:#666;line-height:1.4}
.actions{padding:12px;border-top:1px solid #eee;display:flex;gap:8px}
.btn{background:#FF9900;border:0;padding:10px;border-radius:6px;font-weight:600;cursor:pointer;flex:1}
.btn2{background:#fff;border:1px solid #ccc;padding:10px;border-radius:6px;cursor:pointer;flex:1}
.form{background:#fff;padding:22px;border-radius:10px;max-width:600px;margin:0 auto}
.form label{display:block;margin:12px 0 5px;font-weight:600;font-size:14px}
.form input,.form textarea,.form select{width:100%;padding:11px;border:1px solid #cbd5e0;border-radius:6px;font-size:14px}
.box{border:2px dashed #cbd5e0;padding:12px;border-radius:6px;text-align:center;background:#f7fafc}
#prev{width:100%;max-height:220px;object-fit:cover;border-radius:6px;display:none;margin-top:10px}
.cartbox{background:#fff;padding:18px;border-radius:10px}
.cartItem{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid #eee}
.cartItem img{width:60px;height:60px;object-fit:cover;border-radius:6px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#131921;color:#fff;padding:12px 20px;border-radius:8px;display:none;z-index:999}
#login{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;justify-content:center;align-items:center;z-index:1000;padding:16px}
.loginCard{background:#fff;padding:28px;border-radius:12px;text-align:center;max-width:380px;width:100%}
</style>
</head>
<body>
<div id="toast">Feito!</div>
<div id="login"><div class="loginCard"><h2>🛍️ GlobalMarket MZ</h2><p style="color:#666;font-size:14px;margin:10px 0 20px">Entra para comprar e vender em Mocambique.</p><button class="btn" style="width:100%;padding:12px" onclick="entrar()">Entrar com Google</button><br><br><button class="btn2" style="width:100%" onclick="fecharLogin()">Entrar como Convidado</button></div></div>
<header><div class="logo"><i class="fa-solid fa-bag-shopping"></i> GlobalMarket MZ</div><div class="user"><span id="nomeUser">Convidado</span><img id="avatarUser" src="https://i.pravatar.cc/100"><button onclick="abrirLogin()" style="background:#232f3e;color:#fff;border:1px solid #555;padding:6px 10px;border-radius:6px;cursor:pointer">Entrar</button></div></header>
<nav class="tabs">
<button class="tab-btn active" onclick="muda('vitrine',this)">Vitrine</button>
<button class="tab-btn" onclick="muda('vender',this)">+ Vender Item</button>
<button class="tab-btn" onclick="muda('carrinho',this)">Carrinho (<span id="cartCount">0</span>)</button>
<button class="tab-btn" onclick="muda('definicoes',this)">Definicoes</button>
</nav>
<main>
<div id="vitrine" class="tab-content active"><h2>Produtos em Destaque - Mocambique</h2><div class="grid" id="grid"></div></div>
<div id="vender" class="tab-content"><div class="form"><h2>Cadastrar Novo Item</h2><label>Nome do Produto</label><input id="pNome" placeholder="Ex: Tenis, Telefone, Camera"><label>Preco em MZN</label><input id="pPreco" type="number" placeholder="Ex: 1500"><label>Descricao</label><textarea id="pDesc" rows="3" placeholder="Estado, marca, entrega em Maputo..."></textarea><label>Foto do Produto</label><div class="box"><input type="file" accept="image/*" onchange="preview(event)"><img id="prev"></div><br><button class="btn" style="width:100%;padding:13px" onclick="addProd()">Publicar Produto</button></div></div>
<div id="carrinho" class="tab-content"><h2>Seu Carrinho</h2><div class="cartbox" id="cartBox"><p style="color:#666">Carrinho vazio.</p></div><br><button class="btn" style="width:100%;padding:13px" onclick="finalizar()">Finalizar Compra no WhatsApp</button></div>
<div id="definicoes" class="tab-content"><div class="form"><h2>Definicoes</h2><label>Nome da Tua Loja</label><input id="lojaNome" value="Minha Loja Global"><label>Moeda</label><select id="moeda"><option>MZN - Meticais</option><option>USD - Dolar</option><option>EUR - Euro</option></select><label>Teu WhatsApp para receber pedidos (ex: 258840000000)</label><input id="meuZap" placeholder="25884..."><br><br><button class="btn" style="width:100%" onclick="salvar()">Salvar</button></div></div>
</main><script>
let foto="https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f?auto=format&fit=crop&w=500&q=80";
let produtos=[
{id:1,nome:"Smartwatch Deportivo Pro",preco:2800,desc:"Relogio inteligente a prova dagua, monitor cardiaco. Entrega em Maputo.",img:"https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=500&q=80",vendedor:"Loja Maputo"},
{id:2,nome:"Fone Bluetooth Bass Max",preco:1500,desc:"Som estereo, cancelamento de ruido. Novo.",img:"https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=500&q=80",vendedor:"Loja Beira"},
{id:3,nome:"Tenis Nike Air Importado",preco:3500,desc:"Tamanho 40-44. Original. Stock limitado.",img:"https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=500&q=80",vendedor:"Loja Nampula"},
{id:4,nome:"Telefone Samsung A15",preco:12500,desc:"128GB, dual SIM, caixa selada com garantia.",img:"https://images.unsplash.com/photo-1610945265064-0e34e5519bbf?auto=format&fit=crop&w=500&q=80",vendedor:"Loja Maputo"}
];
let carrinho=[];
function toast(m){let t=document.getElementById('toast');t.innerText=m;t.style.display='block';setTimeout(()=>t.style.display='none',2500);}
function muda(id,btn){document.querySelectorAll('.tab-content').forEach(e=>e.classList.remove('active'));document.querySelectorAll('.tab-btn').forEach(e=>e.classList.remove('active'));document.getElementById(id).classList.add('active');btn.classList.add('active');}
function abrirLogin(){document.getElementById('login').style.display='flex';}
function fecharLogin(){document.getElementById('login').style.display='none';}
function entrar(){document.getElementById('nomeUser').innerText='Utilizador Google';document.getElementById('avatarUser').src='https://i.pravatar.cc/100?img=12';fecharLogin();toast('Login feito! Bem-vindo!');}
function preview(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=function(x){foto=x.target.result;let p=document.getElementById('prev');p.src=foto;p.style.display='block';};r.readAsDataURL(f);}
function mostra(){let g=document.getElementById('grid');g.innerHTML='';produtos.forEach(p=>{g.innerHTML+=`<div class="card"><img src="${p.img}"><div class="body"><b>${p.nome}</b><div class="price">${p.preco} MZN</div><div class="desc">${p.desc}<br><small>Vendedor: ${p.vendedor}</small></div></div><div class="actions"><button class="btn" onclick="addCarrinho(${p.id})">+ Carrinho</button><button class="btn2" onclick="contactar('${p.nome}')">Contactar</button></div></div>`;});}
function addCarrinho(id){let p=produtos.find(x=>x.id===id);carrinho.push(p);document.getElementById('cartCount').innerText=carrinho.length;mostraCarrinho();toast('Adicionado ao carrinho!');}
function mostraCarrinho(){let b=document.getElementById('cartBox');if(carrinho.length===0){b.innerHTML='<p style="color:#666">Carrinho vazio.</p>';return;}let total=0;let html='';carrinho.forEach((p,i)=>{total+=p.preco;html+=`<div class="cartItem"><img src="${p.img}"><div style="flex:1"><b>${p.nome}</b><br>${p.preco} MZN</div><button onclick="remover(${i})" style="border:0;background:#ffdddd;padding:6px 10px;border-radius:6px;cursor:pointer">X</button></div>`;});html+=`<h3 style="margin-top:12px">Total: ${total} MZN</h3>`;b.innerHTML=html;}
function remover(i){carrinho.splice(i,1);document.getElementById('cartCount').innerText=carrinho.length;mostraCarrinho();}
function contactar(nome){let zap=document.getElementById('meuZap').value||'258840000000';let msg=encodeURIComponent('Ola! Quero o produto: '+nome+' - vi na GlobalMarket MZ');window.open('https://wa.me/'+zap+'?text='+msg,'_blank');}
function addProd(){let n=document.getElementById('pNome').value;let pr=document.getElementById('pPreco').value;let d=document.getElementById('pDesc').value;if(!n||!pr){alert('Escreve nome e preco!');return;}produtos.unshift({id:Date.now(),nome:n,preco:parseInt(pr),desc:d||'Sem descricao',img:foto,vendedor:document.getElementById('nomeUser').innerText});mostra();document.getElementById('pNome').value='';document.getElementById('pPreco').value='';document.getElementById('pDesc').value='';toast('Produto publicado!');muda('vitrine',document.querySelector('.tab-btn'));}
function finalizar(){if(carrinho.length===0){alert('Carrinho vazio!');return;}let zap=document.getElementById('meuZap').value||'258840000000';let texto='Ola! Quero comprar na GlobalMarket MZ:%0A';carrinho.forEach(p=>{texto+= '- '+p.nome+' - '+p.preco+' MZN%0A';});window.open('https://wa.me/'+zap+'?text='+texto,'_blank');}
function salvar(){toast('Definicoes salvas!');}
mostra();mostraCarrinho();
</script>
</body>
</html>
